[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gesture-behavior-classifier"
version = "0.1.0"
description = "Rule-based classifier for distinguishing human, software, and hardware touch behaviors from gesture CSV data."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
gesture-classify = "gesture_behavior_classifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gesture_behavior_classifier = ["config/*.json"]
